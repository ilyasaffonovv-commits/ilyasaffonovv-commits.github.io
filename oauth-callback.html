<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Authorization received — TwistFrame Publisher</title>
<style>
  :root{--bg:#fbfbfd;--fg:#1a1a1f;--muted:#5b5b66;--card:#fff;--line:#e6e6ec;--accent:#4f46e5;--ok:#0a7d33;--bad:#c02626}
  @media (prefers-color-scheme:dark){:root{--bg:#0f0f13;--fg:#ececf1;--muted:#a2a2ad;--card:#17171d;--line:#2a2a33;--accent:#8b83ff;--ok:#3ecf6b;--bad:#ff6b6b}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);
    font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  .wrap{max-width:680px;margin:0 auto;padding:56px 22px 90px}
  h1{font-size:1.4rem;margin:.2em 0}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin:20px 0}
  code,.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.92em}
  .box{background:var(--line);border-radius:10px;padding:12px 14px;word-break:break-all;user-select:all}
  button{font:inherit;background:var(--accent);color:#fff;border:0;border-radius:9px;
    padding:9px 16px;cursor:pointer;margin-top:10px}
  .ok{color:var(--ok);font-weight:700}.bad{color:var(--bad);font-weight:700}
  .muted{color:var(--muted)}
  ol{padding-left:1.25em}
</style>
</head>
<body>
<div class="wrap">
  <h1 id="head">Authorization received</h1>
  <p id="sub" class="muted">Copy the value below back into the TwistFrame Publisher terminal.</p>

  <div class="card">
    <div class="muted" style="font-size:.85rem;margin-bottom:6px">FULL REDIRECT URL — copy this</div>
    <div class="box mono" id="url">…</div>
    <button onclick="copyIt()">Copy</button> <span id="copied" class="ok"></span>
  </div>

  <div class="card">
    <strong>In the terminal, run:</strong>
    <div class="box mono" style="margin-top:8px" id="cmd">tfpub.cmd auth-finish tiktok "…"</div>
    <button onclick="copyCmd()">Copy command</button> <span id="copied2" class="ok"></span>
  </div>

  <p class="muted" id="detail"></p>
  <p class="muted"><a href="/">TwistFrame Publisher</a> · <a href="/privacy.html">Privacy</a> · <a href="/terms.html">Terms</a></p>
</div>
<script>
(function(){
  var q = new URLSearchParams(location.search);
  var full = location.href;
  var code = q.get('code'), err = q.get('error');
  document.getElementById('url').textContent = full;
  document.getElementById('cmd').textContent = 'tfpub.cmd auth-finish tiktok "' + full + '"';
  var d = document.getElementById('detail');
  if (err) {
    document.getElementById('head').innerHTML = '<span class="bad">Authorization failed</span>';
    document.getElementById('sub').textContent = 'TikTok returned an error.';
    d.textContent = 'error: ' + err + (q.get('error_description') ? ' — ' + q.get('error_description') : '');
  } else if (code) {
    d.textContent = 'state: ' + (q.get('state')||'(none)');
  } else {
    document.getElementById('sub').textContent =
      'No code in the URL. Open this page only via the TikTok authorization redirect.';
  }
  window.copyIt = function(){ navigator.clipboard.writeText(full).then(function(){
    document.getElementById('copied').textContent='copied'; }); };
  window.copyCmd = function(){ navigator.clipboard.writeText(
    'tfpub.cmd auth-finish tiktok "' + full + '"').then(function(){
    document.getElementById('copied2').textContent='copied'; }); };
})();
</script>
</body>
</html>
